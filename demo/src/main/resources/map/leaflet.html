<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <title>CivicPulse Map</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <style>
        html, body, #map {
            height: 100%;
            margin: 0;
            background: #020617;
        }
    </style>
</head>

<body>
<div id="map"></div>

<script>
    const map = L.map('map').setView([18.5204, 73.8567], 12); // Pune

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
    }).addTo(map);

    // Dummy Issues
    L.marker([18.5204, 73.8567], {icon: redIcon()})
        .addTo(map)
        .bindPopup("🕳 Pothole Issue<br>Status: Pending");

    L.marker([18.5304, 73.8667], {icon: orangeIcon()})
        .addTo(map)
        .bindPopup("💡 Street Light Fault<br>Status: In Progress");

    L.marker([18.5104, 73.8467], {icon: greenIcon()})
        .addTo(map)
        .bindPopup("🚰 Water Leak<br>Status: Resolved");

    function redIcon() {
        return new L.Icon({
            iconUrl: 'https://maps.google.com/mapfiles/ms/icons/red-dot.png',
            iconSize: [32, 32]
        });
    }

    function orangeIcon() {
        return new L.Icon({
            iconUrl: 'https://maps.google.com/mapfiles/ms/icons/orange-dot.png',
            iconSize: [32, 32]
        });
    }

    function greenIcon() {
        return new L.Icon({
            iconUrl: 'https://maps.google.com/mapfiles/ms/icons/green-dot.png',
            iconSize: [32, 32]
        });
    }
</script>
</body>
</html>
